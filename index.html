<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Cat Gacha</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>Lucky Cat Gacha</h1>
      <p class="subtitle">Spin the capsule and test your cat luck!</p>
    </header>

    <main class="game-main">
      <aside class="rewards-panel">
        <h2>Prize List</h2>
        <ul class="rewards-list" id="rewards-list"></ul>
      </aside>

      <section class="gacha-section">
        <div class="chances-display">
          <span class="chances-label">Chances Left</span>
          <span class="chances-count" id="chances-count">5</span>
        </div>

        <div class="gacha-machine" id="gacha-machine">
          <div class="machine-top">
            <div class="machine-window">
              <div class="capsule" id="capsule">
                <div class="capsule-top"></div>
                <div class="capsule-bottom"></div>
              </div>
            </div>
          </div>
          <div class="machine-body">
            <div class="machine-knob" id="machine-knob"></div>
            <div class="machine-slot"></div>
          </div>
        </div>

        <div class="result-display" id="result-display">
          <p class="result-placeholder">Press "Draw Once" to start!</p>
        </div>

        <div class="controls">
          <button class="btn btn-draw" id="btn-draw">Draw Once</button>
          <button class="btn btn-reset" id="btn-reset">Play Again</button>
        </div>
      </section>

      <aside class="history-panel">
        <h2>Draw History</h2>
        <ul class="history-list" id="history-list">
          <li class="history-empty">No draws yet</li>
        </ul>
