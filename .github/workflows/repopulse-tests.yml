name: RepoPulse tests

on:
  push:
    paths:
      - "repo-pulse/**"
      - ".github/workflows/repopulse-tests.yml"
  pull_request:
    paths:
      - "repo-pulse/**"
      - ".github/workflows/repopulse-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo-pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt pytest
          PYTHONPATH=. python -m pytest -q
